# Pinga53: a validating, recursive Unbound resolver for Pi-hole.
# Pi-hole forwards to 127.0.0.1#5335; Unbound asks the root servers itself,
# so no single upstream company sees your whole browsing history.
# Installed by install.sh only when no Unbound resolver on port 5335 exists.
server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    do-ip6: no
    prefer-ip6: no

    # DNSSEC validation and hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: no
    use-caps-for-id: no
    qname-minimisation: yes
    aggressive-nsec: yes
    hide-identity: yes
    hide-version: yes

    # Reply size that avoids IP fragmentation (DNS Flag Day 2020)
    edns-buffer-size: 1232

    # Cache: keep popular names warm, serve briefly-expired answers while refreshing
    prefetch: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    cache-min-ttl: 0
    num-threads: 1
    so-rcvbuf: 1m

    # Never return private addresses for public names (DNS rebinding protection)
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
